    <rect x="140" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="163" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">R</text>
    <rect x="190" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="213" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">A</text>
    <rect x="240" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="263" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">C</text>
    <rect x="290" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="313" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">A</text>
    <rect x="340" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="363" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">D</text>
    <rect x="390" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="413" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">A</text>
    <rect x="440" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="463" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">B</text>
    <rect x="490" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="513" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">R</text>
    <rect x="540" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="563" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">A</text>
    <text x="620" y="100" font-size="15" fill="#3fb950" opacity="0">hash = 101<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0040;0.1210;0.1250;1"/></text>
    <text x="40" y="152" font-size="12.5" fill="#3fb950" opacity="0">MATCH at index 0<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0040;0.1210;0.1250;1"/></text>
    <text x="620" y="100" font-size="15" fill="#58a6ff" opacity="0">hash = 47<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1250;0.1290;0.2460;0.2500;1"/></text>
    <text x="40" y="152" font-size="12.5" fill="#7d8590" opacity="0">hash differs — skip, no character comparison<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1250;0.1290;0.2460;0.2500;1"/></text>
    <text x="620" y="100" font-size="15" fill="#58a6ff" opacity="0">hash = 83<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2540;0.3710;0.3750;1"/></text>
    <text x="40" y="152" font-size="12.5" fill="#7d8590" opacity="0">hash differs — skip, no character comparison<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2540;0.3710;0.3750;1"/></text>
    <text x="620" y="100" font-size="15" fill="#58a6ff" opacity="0">hash = 12<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3750;0.3790;0.4960;0.5000;1"/></text>
    <text x="40" y="152" font-size="12.5" fill="#7d8590" opacity="0">hash differs — skip, no character comparison<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3750;0.3790;0.4960;0.5000;1"/></text>
    <text x="620" y="100" font-size="15" fill="#f0883e" opacity="0">hash = 101<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5040;0.6210;0.6250;1"/></text>
    <text x="40" y="152" font-size="12.5" fill="#f0883e" opacity="0">SPURIOUS HIT — hashes equal, chars differ → verify<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5040;0.6210;0.6250;1"/></text>
    <text x="620" y="100" font-size="15" fill="#58a6ff" opacity="0">hash = 66<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6250;0.6290;0.7460;0.7500;1"/></text>
    <text x="40" y="152" font-size="12.5" fill="#7d8590" opacity="0">hash differs — skip, no character comparison<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6250;0.6290;0.7460;0.7500;1"/></text>
    <text x="620" y="100" font-size="15" fill="#58a6ff" opacity="0">hash = 29<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7540;0.8710;0.8750;1"/></text>
    <text x="40" y="152" font-size="12.5" fill="#7d8590" opacity="0">hash differs — skip, no character comparison<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7540;0.8710;0.8750;1"/></text>
    <text x="620" y="100" font-size="15" fill="#3fb950" opacity="0">hash = 101<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8750;0.8790;0.9960;1.0000;1"/></text>
    <text x="40" y="152" font-size="12.5" fill="#3fb950" opacity="0">MATCH at index 7<animate attributeName="opacity" dur="9.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8750;0.8790;0.9960;1.0000;1"/></text>
    <text x="40" y="186" font-size="10.5" fill="#484f58">collisions force character checks — enough of them drag O(n+m) toward O(n×m)</text>
  </g>
</svg>
