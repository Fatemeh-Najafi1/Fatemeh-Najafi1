<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 214" width="840" height="214" role="img" aria-label="Animated Rabin-Karp: a four-character window slides across ABRACADABRA. The rolling hash updates at each step; a hash collision at position 4 triggers a spurious hit requiring character verification, while positions 0 and 7 are true matches.">
  <rect x="1" y="1" width="838" height="212" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="40" y="46" font-size="11.5" fill="#7d8590">pattern <tspan fill="#c9d1d9">ABRA</tspan>  ·  hash <tspan fill="#58a6ff">101</tspan></text>
    <rect y="66" width="196" height="54" rx="6" fill="#1f6feb22" stroke="#58a6ff" stroke-width="1.8" x="36"><animate attributeName="x" dur="9.2s" repeatCount="indefinite" calcMode="discrete" values="36;86;136;186;236;286;336;386"/></rect>
    <rect x="40" y="70" width="46" height="46" rx="5" fill="#161b22" stroke="#30363d"/><text x="63" y="100" font-size="17" fill="#c9d1d9" text-anchor="middle">A</text>
