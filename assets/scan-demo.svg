<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Animated terminal: picklelens scans a PyTorch model file, interprets its pickle opcode stream without executing it, and reports it as malicious with a risk score of 100 and MITRE ATT and CK tags.">
  <defs>
    <linearGradient id="riskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="28" y="64" width="0" height="26">
        <animate attributeName="width" dur="11s" repeatCount="indefinite"
                 values="0;0;312;312;312;0" keyTimes="0;0.02;0.15;0.95;0.99;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="838" height="328" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="838" height="38" rx="12" fill="#161b22"/>
  <rect x="1" y="27" width="838" height="12" fill="#161b22"/>
  <line x1="1" y1="39" x2="839" y2="39" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="64" cy="20" r="5.5" fill="#28c840"/>
  <text x="420" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">picklelens — static analysis, nothing executed</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

    <!-- typed command -->
    <g clip-path="url(#typeClip)" font-size="14.5">
      <text x="28" y="82" fill="#7ee787">$<tspan fill="#c9d1d9" dx="10">picklelens scan pytorch_model.bin</tspan></text>
    </g>
    <rect x="30" y="68" width="8.5" height="19" fill="#58a6ff">
      <animate attributeName="x" dur="11s" repeatCount="indefinite"
               values="30;30;338;338;338;30" keyTimes="0;0.02;0.15;0.95;0.99;1"/>
      <animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1"/>
    </rect>

    <!-- stage 1 -->
    <text x="28" y="112" font-size="13" fill="#7d8590" opacity="0">
      unwrap container ▸ opcode stream ▸ symbolic interpreter
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.17;0.19;0.95;0.99;1"/>
    </text>

    <!-- stage 2 -->
    <text x="28" y="136" font-size="13" fill="#7d8590" opacity="0">
      0 imports · 0 deserializations · 0 bytes executed
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.23;0.25;0.95;0.99;1"/>
    </text>

    <!-- reachable call -->
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.30;0.32;0.95;0.99;1"/>
      <text x="28" y="168" font-size="14.5" fill="#f85149">critical<tspan fill="#c9d1d9" dx="14">reachable call</tspan><tspan fill="#ffa657" dx="12">os.system</tspan></text>
      <text x="100" y="188" font-size="12" fill="#484f58">resolved from<tspan fill="#8b949e" dx="8">getattr(__import__('os'),'system')</tspan></text>
    </g>

    <!-- verdict -->
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.37;0.39;0.95;0.99;1"/>
      <rect x="28" y="206" width="112" height="26" rx="5" fill="#da3633">
        <animate attributeName="fill" dur="1.6s" repeatCount="indefinite" values="#da3633;#f85149;#da3633"/>
      </rect>
      <text x="84" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff" letter-spacing="1">MALICIOUS</text>
      <text x="156" y="224" font-size="14.5" fill="#c9d1d9">Infostealer / spyware</text>
    </g>

    <!-- risk bar -->
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.95;0.99;1"/>
      <text x="28" y="258" font-size="13" fill="#7d8590">risk</text>
      <rect x="64" y="246" width="320" height="14" rx="7" fill="#21262d"/>
      <rect x="64" y="246" width="0" height="14" rx="7" fill="url(#riskGrad)">
        <animate attributeName="width" dur="11s" repeatCount="indefinite"
                 values="0;0;320;320;320;0" keyTimes="0;0.42;0.56;0.95;0.99;1"/>
      </rect>
      <text x="398" y="258" font-size="13" font-weight="bold" fill="#f85149">100/100</text>
    </g>

    <!-- attack tags -->
    <g opacity="0" font-size="12.5">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.58;0.60;0.95;0.99;1"/>
      <rect x="28" y="276" width="76" height="22" rx="11" fill="#21262d" stroke="#f85149" stroke-width="1"/>
      <text x="66" y="291" text-anchor="middle" fill="#ff7b72">T1059</text>
      <rect x="112" y="276" width="76" height="22" rx="11" fill="#21262d" stroke="#f85149" stroke-width="1"/>
      <text x="150" y="291" text-anchor="middle" fill="#ff7b72">T1105</text>
      <rect x="196" y="276" width="76" height="22" rx="11" fill="#21262d" stroke="#f85149" stroke-width="1"/>
      <text x="234" y="291" text-anchor="middle" fill="#ff7b72">T1041</text>
      <text x="288" y="291" fill="#7d8590">exfil.evil-corp.top · /tmp/loot.tgz · AWS keys</text>
    </g>

    <!-- right rail: what did NOT happen -->
    <g opacity="0" font-size="12">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.95;0.99;1"/>
      <rect x="500" y="104" width="312" height="140" rx="8" fill="#0b1b12" stroke="#238636" stroke-width="1.2"/>
      <text x="516" y="126" fill="#3fb950" font-weight="bold">safe by construction</text>
      <text x="516" y="150" fill="#7d8590">✓ never calls torch.load / pickle.load</text>
      <text x="516" y="170" fill="#7d8590">✓ never imports the named modules</text>
      <text x="516" y="190" fill="#7d8590">✓ pure stdlib · deterministic · offline</text>
      <text x="516" y="210" fill="#7d8590">✓ verdict = reachable execution</text>
      <text x="516" y="230" fill="#484f58">the payload is read, never run</text>
    </g>

  </g>
</svg>
